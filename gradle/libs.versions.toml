[versions]
java = "17"
kotlin = "2.4.21"
commons = "1.0.5-SNAPSHOT"
kotlinx-serialization = "1.12.0"
unimined-mapping-library = "2.0.0"
tiny-remapper = "0.15.0"
jst-cli = "2.0.11"
junit = "6.1.3"

[plugins]
kotlin = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-multiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
commons = { id = "xyz.wagyourtail.commons-gradle", version.ref = "commons" }

[libraries]
commons-kt = { module = "xyz.wagyourtail.commons:commons-kt", version.ref = "commons" }
commons-gradle = { module = "xyz.wagyourtail.commons:commons-gradle", version.ref = "commons" }

kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinx-serialization" }

unimined-mapping-library = { module = "xyz.wagyourtail.unimined.mapping:unimined-mapping-library", version.ref = "unimined-mapping-library" }

tiny-remapper = { module = "net.fabricmc:tiny-remapper", version.ref = "tiny-remapper" }

asm = { module = "org.ow2.asm:asm", version = "9.9" }

# note: consumer should resolve the `:all` (fat) classifier
jst-cli = { module = "net.neoforged.jst:jst-cli", version.ref = "jst-cli" }

junit-jupiter = { module = "org.junit.jupiter:junit-jupiter", version.ref = "junit" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher" }
