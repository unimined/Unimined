name: Build Release

on:
  release:
    types: [ created ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Publish
        run: ./gradlew publish :unimined-cli:fatJar -Pmvn.user=${{ secrets.MAVEN_USER }} -Pmvn.key=${{ secrets.MAVEN_TOKEN }}

      - uses: actions/upload-artifact@v4
        with:
          name: unimined-artifacts
          path: '**/build/libs/'

      # testing/ fixture projects packaged for release consumers —
      # see `packageTemplates` in the root build script
      - name: Package templates
        run: ./gradlew packageTemplates

      - name: Attach release artifacts
        run: |
          gh release upload "${{ github.event.release.tag_name }}" \
            ./build/distributions/unimined-templates.zip \
            "./unimined-cli/build/libs/unimined-cli-${{ github.event.release.tag_name }}-fat.jar"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  templates:
    needs: [build]
    strategy:
      fail-fast: false
      matrix:
        include:
          - { mode: multiloader, args: "--modules --loader fabric=latest --loader forge=latest" }
          - { mode: forge,       args: "--loader forge=latest" }
          - { mode: fabric,      args: "--loader fabric=latest" }
          - { mode: bta,         args: "--product bta" }
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: build the CLI jar
        run: ./gradlew :unimined-cli:fatJar -q
      - name: materialize deploy key
        run: |
          printf '%s' '${{ secrets.TEMPLATES_DEPLOY_KEY }}' > $RUNNER_TEMP/tmpl-key
          chmod 600 $RUNNER_TEMP/tmpl-key
      - name: checkout or init release/${{ matrix.mode }}
        run: |
          mkdir -p tmpl && cd tmpl
          git init
          git remote add origin git@github.com:unimined/Unimined-Templates.git 2>/dev/null || true
          if git fetch origin release/${{ matrix.mode }}; then
            git checkout -B release/${{ matrix.mode }} FETCH_HEAD
          else
            git checkout --orphan release/${{ matrix.mode }} 2>/dev/null || true
          fi
        env:
          GIT_SSH_COMMAND: ssh -i $RUNNER_TEMP/tmpl-key -o IdentitiesOnly=yes
      - name: generate
        run: |
          java -jar unimined-cli/build/libs/unimined-cli-*-fat.jar init \
            --group com.example --mc latest --plugin-version ${{ github.event.release.tag_name }} \
            ${{ matrix.args }} --out tmpl --metadata dsl
      - name: push on diff
        run: |
          cd tmpl
          git add -A
          git diff --cached --quiet && exit 0
          git -c user.name="unimined-ci" -c user.email="ci@unimined.dev" \
            commit -m "regen: ${{ matrix.mode }} @ ${{ github.event.release.tag_name }}"
          git push origin release/${{ matrix.mode }}
        env:
          GIT_SSH_COMMAND: ssh -i $RUNNER_TEMP/tmpl-key -o IdentitiesOnly=yes
