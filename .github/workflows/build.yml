name: Build Release

on:
  release:
    types: [ created ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Publish
        run: ./gradlew publish :unimined-cli:fatJar -Pmvn.user=${{ secrets.MAVEN_USER }} -Pmvn.key=${{ secrets.MAVEN_TOKEN }}

      - uses: actions/upload-artifact@v4
        with:
          name: unimined-artifacts
          path: '**/build/libs/'

      # testing/ fixture projects packaged for release consumers —
      # see `packageTemplates` in the root build script
      - name: Package templates
        run: ./gradlew packageTemplates

      - name: Attach release artifacts
        run: |
          gh release upload "${{ github.event.release.tag_name }}" \
            ./build/distributions/unimined-templates.zip \
            "./unimined-cli/build/libs/unimined-cli-${{ github.event.release.tag_name }}-fat.jar"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
