name: Build Release

on:
  release:
    types: [ created ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Publish
        run: ./gradlew publish :unimined-cli:linkReleaseExecutableLinuxX64 -Pmvn.user=${{ secrets.MAVEN_USER }} -Pmvn.key=${{ secrets.MAVEN_TOKEN }}

      - uses: actions/upload-artifact@v4
        with:
          name: unimined-artifacts
          path: '**/build/libs/'

      - name: Package node cli dist
        run: |
          ./gradlew :unimined-cli:jsProductionExecutableCompileSync
          cd unimined-cli/build/compileSync/js/main/productionExecutable/kotlin
          zip -qr "$GITHUB_WORKSPACE/unimined-cli-node.zip" .

      - name: Attach release artifacts
        run: |
          gh release upload "${{ github.event.release.tag_name }}" \
            "./unimined-cli/build/bin/linuxX64/releaseExecutable/unimined-cli.kexe" \
            "./unimined-cli-node.zip"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  templates:
    needs: [build]
    strategy:
      fail-fast: false
      matrix:
        include:
          - { mode: multiloader, args: "--modules --loader fabric=latest --loader forge=latest" }
          - { mode: forge,       args: "--loader forge=latest" }
          - { mode: fabric,      args: "--loader fabric=latest" }
          - { mode: bta-gen,     args: "--product bta" }
          - { mode: bta,             args: '--product bta --version 7.3_04 --side MERGED --loader bta-babric=0.18.4-bta.11' }
          - { mode: reindev,         args: '--product reindev --version 2.9_03 --side SERVER --loader foxloader=' }
          - { mode: nsss,            args: '--product nsss --version 1.0 --side CLIENT --dist dist.jar' }
          - { mode: jarmod,          args: '--version 1.20.1 --loader jarmod=0.1.5 --mappings "yarn(10)"' }
          - { mode: fg1,             args: '--version 1.4.7 --loader fg1=0.1.5' }
          - { mode: forge-125,       args: '--version 1.2.5 --side CLIENT --loader fg1=0.1.5 --mappings "mcp(\"legacy\", \"6.2-1.2.5\")"' }
          - { mode: forge-mojmap,    args: '--version 1.20.1 --loader forge=47.3.0 --mappings "mojmap()"' }
          - { mode: forge-yarn,      args: '--version 1.20.1 --loader forge=47.3.0 --mappings "intermediary()" --mappings "yarn(10)"' }
          - { mode: fabric-mojmap,   args: '--version 1.20.1 --loader fabric=0.16.0 --mappings "mojmap()" --toolchain 17' }
          - { mode: ornithe-b173,    args: '--version b1.7.3 --side MERGED --loader ornithe=0.19.5 --mappings "feather(2,2)" --mappings "nests(1)" --mappings "sparrow(2)" --var ornitheGenVersion=2' }
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: build the CLI jar
        run: ./gradlew :unimined-cli:linkReleaseExecutableLinuxX64 -q
      - name: materialize deploy key
        run: |
          printf '%s\n' '${{ secrets.TEMPLATES_DEPLOY_KEY }}' > $RUNNER_TEMP/tmpl-key
          chmod 600 $RUNNER_TEMP/tmpl-key
      - name: checkout or init release/${{ matrix.mode }}
        run: |
          mkdir -p tmpl && cd tmpl
          git init
          git remote add origin git@github.com:unimined/Unimined-Templates.git 2>/dev/null || true
          if git fetch origin release/${{ matrix.mode }}; then
            git checkout -B release/${{ matrix.mode }} FETCH_HEAD
          else
            git checkout --orphan release/${{ matrix.mode }} 2>/dev/null || true
          fi
        env:
          GIT_SSH_COMMAND: ssh -i $RUNNER_TEMP/tmpl-key -o IdentitiesOnly=yes
      - name: generate
        run: |
          ./unimined-cli/build/bin/linuxX64/releaseExecutable/unimined-cli.kexe init \
            --group com.example --mc latest --plugin-version ${{ github.event.release.tag_name }} \
            ${{ matrix.args }} --out tmpl --metadata dsl
      - name: push on diff
        run: |
          cd tmpl
          git add -A
          git diff --cached --quiet && exit 0
          git -c user.name="unimined-ci" -c user.email="ci@unimined.dev" \
            commit -m "regen: ${{ matrix.mode }} @ ${{ github.event.release.tag_name }}"
          git push origin release/${{ matrix.mode }}
        env:
          GIT_SSH_COMMAND: ssh -i $RUNNER_TEMP/tmpl-key -o IdentitiesOnly=yes
