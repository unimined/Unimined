name: config-cache smoke

# Phase 8 hardening job: every DSL surface must configure cleanly
# under strict configuration-cache (problems fail the build).
on:
  push:
    branches: [master, main, develop, 'feature/**']
  pull_request:

jobs:
  smoke:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # generated via unimined-cli — checked-in fixtures only
          # remain for shapes the generator can't emit yet (FG2)
          - { project: fabric-yarn, gen: '--version 1.20.1 --loader fabric=0.16.0 --mappings "yarn(10)" --toolchain 17' }
          - { project: vanilla-mojmap, gen: '--version 1.20.1 --mappings "mojmap()" --toolchain 17' }
          - { project: forge-fg2, gen: '--version 1.12.2 --loader forge=14.23.5.2860 --mappings "searge()" --mappings "mcp(\"stable\", \"39-1.12\")" --extra "runs { named(\"server\") { if (providers.gradleProperty(\"autoStop\").isPresent) stdin.set(\"stop\\n\") } }"' }
          # P9 cross-toolchain interop — loom-published intermediary
          # jars (modmenu refmap, TAW access-widener, FLK nested jars)
          # through modImplementation remap; verified below by
          # testing/interop-verify.sh on the -named outputs
          - { project: interop-fabric, gen: '--version 1.20.1 --loader fabric=0.16.0 --mappings "yarn(10)" --toolchain 17 --extra "repositories { maven(\"https://api.modrinth.com/maven\") }" --extra "dependencies { modImplementation(\"maven.modrinth:modmenu:7.2.2\"); modImplementation(\"net.fabricmc.fabric-api:fabric-transitive-access-wideners-v1:1.3.3+08b73de490\"); modImplementation(\"net.fabricmc:fabric-language-kotlin:1.11.0+kotlin.2.0.0\") }"', deps: 'modmenu-7.2.2 fabric-transitive-access-wideners-v1-1.3.3+08b73de490 fabric-language-kotlin-1.11.0+kotlin.2.0.0' }
          # SRG-named 1.12-era universal jar (JEI) — srg->mcp dev-ns hop
          - { project: interop-forge, gen: '--version 1.12.2 --loader forge=14.23.5.2860 --mappings "searge()" --mappings "mcp(\"stable\", \"39-1.12\")" --extra "repositories { maven(\"https://maven.blamejared.com\") }" --extra "dependencies { modImplementation(\"mezz.jei:jei_1.12.2:4.16.1.302\") }"', deps: 'jei_1.12.2-4.16.1.302' }
          # loader-family coverage — coords pinned to launch-verified
          # versions (see Docs/loader-matrix.md)
          - { project: neoforge-1201, gen: '--version 1.20.1 --loader neoforge=47.1.106 --toolchain 17' }
          - { project: quilt-1201, gen: '--version 1.20.1 --loader quilt=0.31.0-beta.6 --toolchain 17' }
          # gen-2 ornithe needs the mappings-var or the implicit
          # intermediary import lands gen1 while feather uses gen2
          - { project: ornithe-b173, gen: '--version b1.7.3 --side merged --loader ornithe=0.19.5 --mappings "feather(2, 2)" --mappings "nests(1)" --mappings "sparrow(2)" --var ornitheGenVersion=2 --toolchain 8' }
          # bukkit family via paper — craftbukkit/spigot have no
          # public dist (serverArtifact: provider needs BuildTools),
          # paper compiles against published paper-api
          - { project: paper-1211, gen: '--version 1.21.1 --loader paper=latest --toolchain 21' }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          # 17 stays JAVA_HOME (last wins); 8 for toolchain resolution
          # of old-MC fixtures (forge-fg2/ornithe), 21 for paper-1211
          java-version: |
            8
            21
            17
      - name: build CLI jar + generate fixture
        if: matrix.gen != ''
        run: |
          ./gradlew :unimined-cli:linkReleaseExecutableLinuxX64 -q
          ./unimined-cli/build/bin/linuxX64/releaseExecutable/unimined-cli.kexe \
            new ${{ matrix.project }} --group com.example ${{ matrix.gen }} \
            --include-build ../.. --no-wrapper \
            --out testing/${{ matrix.project }}
      - name: configure + build under strict config-cache
        run: |
          ./gradlew -p testing/${{ matrix.project }} classes \
            --configuration-cache \
            --configuration-cache-problems=fail \
            --stacktrace
      - name: interop dep-remap verification
        if: matrix.deps
        run: |
          ./testing/interop-verify.sh \
            testing/${{ matrix.project }} ${{ matrix.deps }}
      - name: report cache reuse (informational)
        # not a gate: the composite includeBuild fingerprints the
        # included-build tree — .git/index refresh by autoversion's
        # git calls mutates ../.. every run, so cross-invocation
        # reuse is structurally unstable on a clean checkout. The
        # strict CC gate is the configure+build step above
        # (problems=fail). Reuse status is reported for signal.
        run: |
          ./gradlew -p testing/${{ matrix.project }} classes \
            --configuration-cache \
            --configuration-cache-problems=fail -q
          ./gradlew -p testing/${{ matrix.project }} classes \
            --configuration-cache \
            --configuration-cache-problems=fail 2>&1 | tee cc-verify.log
          if grep -q "Configuration cache entry reused" cc-verify.log; then
            echo "CC entry reused"
          else
            grep -E "cannot be reused" cc-verify.log | head -3 || true
            echo "::notice::CC entry not reused (composite ../.. fingerprint)"
          fi
