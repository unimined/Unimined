name: config-cache smoke

# Phase 8 hardening job: every DSL surface must configure cleanly
# under strict configuration-cache (problems fail the build).
on:
  push:
    branches: [master, main, develop, 'feature/**']
  pull_request:

jobs:
  smoke:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project: [vanilla-mojmap, fabric-yarn, forge-fg2]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          # 17 stays JAVA_HOME (last wins); 8 for toolchain resolution
          # of old-MC fixtures (forge-fg2 requires Java 8)
          java-version: |
            8
            17
      - name: configure + build under strict config-cache
        run: |
          ./gradlew -p testing/${{ matrix.project }} classes \
            --configuration-cache \
            --configuration-cache-problems=fail \
            --stacktrace
      - name: verify the cache entry was stored
        # same task graph as above — the CC key is the task set, so
        # re-running `classes` is the only way to observe reuse
        run: |
          ./gradlew -p testing/${{ matrix.project }} classes \
            --configuration-cache \
            --configuration-cache-problems=fail 2>&1 | tee cc-verify.log
          grep -q "Configuration cache entry reused" cc-verify.log || {
            grep -E "cannot be reused|problems? (were )?found" cc-verify.log | head -20
            exit 1
          }
          echo "CC entry reused — strict pass"
