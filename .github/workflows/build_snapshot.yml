name: Build Snapshot

on:
  push:
    branches-ignore:
      - 'feature/**'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Publish
        run: ./gradlew publish :unimined-cli:fatJar -Pversion_snapshot -Pmvn.user=${{ secrets.MAVEN_USER }} -Pmvn.key=${{ secrets.MAVEN_TOKEN }} -x test

      - uses: actions/upload-artifact@v4
        with:
          name: unimined-snapshot-artifacts
          path: '**/build/libs/'

      - uses: actions/upload-artifact@v4
        with:
          name: unimined-cli-snapshot
          path: 'unimined-cli/build/libs/*-fat.jar'
