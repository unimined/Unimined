plugins {
    java
    id 'xyz.wagyourtail.unimined' version '2.0.0-SNAPSHOT'
}


repositories {
    mavenCentral()

}

unimined {
    minecraft {
        version.set(providers.gradleProperty("minecraft_version").get())


        mappings {
            yarn(providers.gradleProperty("yarn_mappings").get())
        }
    }

}

dependencies {
    // mods on the classpath — remapped onto your mappings
    // modImplementation("maven:coord")
    // modCompileOnly(...) / modLocalRuntime(...)
    // unimined.loaderApi("fabric", "0.92.2+1.20.1") — loader api coords
    // (also records the api modid into mod { depends } automatically)
}



def client = sourceSets.create("client")
def server = sourceSets.create("server")

tasks.register("clientJar", Jar) {
    from client.output
    archiveClassifier.set("client")
    manifest {
        attributes("JarModAgent-Transforms": "examplemod-client.transform")
    }
}

tasks.register("serverJar", Jar) {
    from server.output
    archiveClassifier.set("server")
    manifest {
        attributes("JarModAgent-Transforms": "examplemod-server.transform")
    }
}
