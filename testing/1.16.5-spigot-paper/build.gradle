plugins {
    id 'java'
    id 'xyz.wagyourtail.unimined' // version '1.0.0'
}

group 'com.example'
version '1.0-SNAPSHOT'

base {
    archivesName = 'UniminedExampleMod'
}


// this is just here so we can test the outputs easier and clean between tests
unimined.useGlobalCache = false

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
    sourceCompatibility = JavaVersion.VERSION_1_8
}

tasks.withType(JavaCompile).configureEach {
    options.release = 8
}

sourceSets {
    spigot
    paper
}

unimined.minecraft {
    version project.minecraft_version
    side "server"

    mappings {
        spigotDev()
        mojmap()

        stubs(["official", "spigotDev", "spigotProd"]) {
            c(["czq\$b"]) {
                m(["a", "serializeType0", "a;(Lcom/google/gson/JsonObject;Lnet/minecraft/server/v1_16_R3/LootEntryAbstract;Lcom/google/gson/JsonSerializationContext;)V"])
            }
            c(["gg"]) {
                m(["a;(Ljava/lang/Object;)I", "getIdVanilla"])
            }
        }
    }

}

unimined.minecraft(sourceSets.spigot) {
    combineWith(sourceSets.main)

    spigot {
        loader "1.16.5"
    }
}

unimined.minecraft(sourceSets.paper) {
    combineWith(sourceSets.main)

    paper {
        loader "794"
    }

}

