site_name: Unimined Docs
site_description: Unified Minecraft modding environment — modern and legacy
site_url: https://wagyourtail.github.io/unimined/docs/
repo_url: https://github.com/wagyourtail/unimined
edit_uri: edit/develop/docs/

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: deep purple
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: deep purple
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - content.tabs.link
    - content.code.copy

plugins:
  - search
  - macros
  - mike:
      deploy_prefix: docs
      canonical_version: latest
      version_selector: true

extra:
  version:
    provider: mike
    default: latest
  plugin_version: "1.4.1"

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.snippets
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Getting Started:
    - Installation: getting-started/installation.md
    - First Project: getting-started/first-project.md
    - unimined-cli: getting-started/cli.md
  - Guide:
    - Environments: guide/environments.md
    - Sources: guide/sources.md
    - Loaders: guide/loaders.md
    - Mappings: guide/mappings.md
    - Dependencies: guide/dependencies.md
    - Remap Pipeline: guide/remap-pipeline.md
    - Transform & Migrate: guide/transform-migrate.md
    - Products: guide/products.md
    - Run Configs: guide/run-configs.md
    - Auth: guide/auth.md
    - Datagen: guide/datagen.md
    - Gametests: guide/gametest.md
    - Mod Metadata: guide/metadata.md
    - Multiple Source Sets & Projects: guide/multi-project.md
    - Publishing: guide/publishing.md
  - Adapters:
    - Overview: adapters/index.md
    - JvmDowngrader: adapters/jvmdg.md
    - ModPublisher: adapters/modpublisher.md
    - PatchBase: adapters/patchbase.md
    - Forgix: adapters/forgix.md
    - Stonecutter: adapters/stonecutter.md
    - ExpectPlatform: adapters/expectplatform.md
  - Migrating 1.x to 2.0: migration-1x-to-2.0.md
  - Reference:
    - DSL Index: reference/index.md
    - API: reference/api.md
    - CLI: reference/cli.md

not_in_nav: |
  generated/*
